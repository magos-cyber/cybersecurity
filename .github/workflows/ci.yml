name: Security Tools CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -exec shellcheck {} \; 2>/dev/null || true
          
      - name: Python syntax
        run: |
          find . -name "*.py" -exec python3 -m py_compile {} \; 2>/dev/null || true
